name: Android 与 Windows 打包发布
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 1.2.11
        required: true
      mode:
        description: new 发布新版本；existing 重建已有版本的安装包
        type: choice
        options: [new, existing]
        default: new
      notes:
        description: 新版本发布说明（可选）
        required: false
permissions:
  contents: read
concurrency:
  group: assistance-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      ref: ${{ steps.plan.outputs.ref }}
      mode: ${{ steps.plan.outputs.mode }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查签名配置与发布来源
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = refs/heads/master || { echo '::error::请从 master 运行发布工作流'; exit 1; }
          for name in KEYSTORE STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!name}" || { echo '::error::请先配置四个 Android Actions 签名 Secrets，参见发布指南'; exit 1; }
          done
      - name: 规划版本，不改动代码或标签
        id: plan
        run: python3 scripts/ci_release.py plan "$RELEASE_VERSION" "$RELEASE_MODE"
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          path: app
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-flutter
      - name: 准备 Android SDK 与签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          python3 - <<'PY'
          import os,base64,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'signing.keystore'
          p.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'CI_KEYSTORE_PATH={p}\n')
              f.write(f'CI_RELEASE_HELPER={os.environ["GITHUB_WORKSPACE"]}/automation/scripts/ci_release.py\n')
          PY
      - name: 构建、原密钥签名并校验 APK
        working-directory: app
        run: |
          set -euo pipefail
          if bash "$GITHUB_WORKSPACE/automation/scripts/release.sh" "$RELEASE_VERSION" --ci-build 2>&1 | tee "$RUNNER_TEMP/android-build.log"; then
            exit 0
          fi
          python3 - <<'PYLOG'
          import os,pathlib
          log=(pathlib.Path(os.environ['RUNNER_TEMP'])/'android-build.log').read_text(errors='replace')[-12000:]
          log=log.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=Android 构建失败::{log}')
          PYLOG
          exit 1
      - name: 保存 Android 构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android
          path: |
            app/build/app/outputs/flutter-apk/app-*-release.apk
            app/build/app/outputs/flutter-apk/manifest-android.json
          if-no-files-found: error
          retention-days: 7
      - name: 清理签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keystore"
  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CXXFLAGS: /utf-8
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          path: app
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-flutter
      - name: 准备 Inno Setup
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.4.3 --yes --no-progress
          }
          "CI_RELEASE_HELPER=$env:GITHUB_WORKSPACE\automation\scripts\ci_release.py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 构建并校验 Windows 安装包
        working-directory: app
        run: |
          & "$env:GITHUB_WORKSPACE\automation\scripts\release.ps1" $env:RELEASE_VERSION -BuildOnly -BuildNumber ([int]$env:RELEASE_BUILD)
          if ($LASTEXITCODE -ne 0) { throw 'Windows 打包失败' }
      - name: 保存 Windows 构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows
          path: |
            app/build/windows/installer/my_assistant_setup_*.exe
            app/build/windows/installer/manifest-windows.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [prepare, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
      CI_RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
      CI_SOURCE_SHA: ${{ needs.prepare.outputs.ref }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: 两个平台全部成功后统一发布
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/release.sh "$RELEASE_VERSION" --ci-publish
