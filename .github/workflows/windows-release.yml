name: Windows 安装包补充发布
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 已正式发布的标签，例如 v1.2.13
        required: true
      source:
        description: master 使用最新代码；tag 重新打包原标签
        type: choice
        options:
          - master
          - tag
        default: master
      notes:
        description: 本次安装包更新说明（可选）
        required: false
permissions:
  contents: read
concurrency:
  group: assistance-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      ref: ${{ steps.plan.outputs.ref }}
      base: ${{ steps.plan.outputs.base }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_CHOICE: ${{ inputs.source }}
      RELEASE_PLATFORM: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查发布来源与标签
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |-
          set -euo pipefail
          test "$WORKFLOW_REF" = refs/heads/master
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::标签格式必须为 vx.y.z"; exit 1; }
      - id: plan
        name: 规划单平台补发构建号
        run: python3 scripts/ci_release.py plan-single "${RELEASE_TAG#v}" "$RELEASE_PLATFORM" "$SOURCE_CHOICE"
  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CXXFLAGS: /utf-8
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          path: app
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-flutter
      - name: 准备 Inno Setup
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.4.3 --yes --no-progress
          }
          "CI_RELEASE_HELPER=$env:GITHUB_WORKSPACE\automation\scripts\ci_release.py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 构建并校验 Windows 安装包
        working-directory: app
        run: |
          & "$env:GITHUB_WORKSPACE\automation\scripts\release.ps1" $env:RELEASE_VERSION -BuildOnly -BuildNumber ([int]$env:RELEASE_BUILD)
          if ($LASTEXITCODE -ne 0) { throw 'Windows 打包失败' }
      - name: 保存 Windows 构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows
          path: |
            app/build/windows/installer/my_assistant_setup_*.exe
            app/build/windows/installer/manifest-windows.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs:
      - prepare
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
      CI_SOURCE_SHA: ${{ needs.prepare.outputs.ref }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
      CI_RELEASE_PLATFORM: windows
      CI_BASE_SHA: ${{ needs.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: windows
          path: release-assets
          merge-multiple: true
      - name: 校验并补发当前平台安装包
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/release.sh "$RELEASE_VERSION" --ci-single-publish
