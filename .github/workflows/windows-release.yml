name: Windows 安装包补充发布
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已正式发布的版本标签
        required: true
        default: v1.2.10
  push:
    branches: [work]
    paths: [.github/workflows/windows-release.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: windows-release-${{ inputs.tag || 'v1.2.10' }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CXXFLAGS: /utf-8
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || 'v1.2.10' }}
    steps:
      - name: 获取发布工具
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: automation
          persist-credentials: false
      - name: 校验标签格式
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw '标签格式必须为 vx.y.z' }
      - name: 获取已发布的源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: app
          persist-credentials: false
      - name: 安装固定 Flutter SDK 和 Inno Setup
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $flutterCommit = 'abaf9c523780a608bd46686fd5e53740a07077f8'
          $flutterDir = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --no-checkout --depth 1 --branch stable https://github.com/flutter/flutter.git $flutterDir
          git -C $flutterDir fetch --depth 1 origin $flutterCommit
          git -C $flutterDir checkout --detach FETCH_HEAD
          if ((git -C $flutterDir rev-parse HEAD) -ne $flutterCommit) { throw 'Flutter 提交不匹配' }
          "$flutterDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.4.3 --yes --no-progress
          }
      - name: 通过发布脚本构建、校验并上传 Windows 安装包
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\automation\scripts\release.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          $version = $env:RELEASE_TAG.Substring(1)
          & "$env:GITHUB_WORKSPACE\automation\scripts\release.ps1" $version -WindowsOnly *>&1 | ForEach-Object {
            $_ | Out-File -FilePath "$env:RUNNER_TEMP\windows-release.log" -Encoding utf8 -Append
            Write-Output $_
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows 安装包补充发布失败' }
      - name: 报告构建错误
        if: failure()
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-release.log'
          if (Test-Path $log) {
            $lines = Get-Content $log -Encoding utf8
            $details = @($lines | Select-String -Pattern 'error C[0-9]+|fatal error|CMake Error|error LNK|version solving failed|Because .+|SDK version is|Error:' | Select-Object -First 8 | ForEach-Object { $_.Line })
            if ($details.Count -eq 0) { $details = @($lines | Select-Object -Last 8) }
            $details | ForEach-Object {
              $line = $_.Replace('%', '%25')
              Write-Output "::error title=Windows 构建日志::$line"
            }
          }
