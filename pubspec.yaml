name: my_assistant
description: 轻量级个人工具集App - 记账与生理期记录
publish_to: 'none'
version: 1.1.2+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  sqflite: ^2.3.0
  fl_chart: ^0.69.0
  intl: ^0.20.2
  uuid: ^4.4.0
  path_provider: ^2.1.0
  path: ^1.9.0
  sqflite_common_ffi: ^2.4.1
  file_picker: ^11.0.0
  shelf: ^1.4.0
  url_launcher: ^6.2.0
  package_info_plus: ^8.0.0
  http: ^1.2.0
  dio: ^5.11.0
  open_filex: ^4.7.0
  # 12.x：13.x 依赖的 permission_handler_android 14 需要 compileSdk 36.1 的
  # ACCESS_LOCAL_NETWORK 常量，与当前 compileSdk 36 不兼容
  permission_handler: ^12.0.0
  device_info_plus: ^12.4.0
  encrypt: ^5.0.3           # AES-256-GCM 加解密封装
  pointycastle: ^3.9.1      # Argon2id 实现
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system
