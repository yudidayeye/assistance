name: my_assistant
description: 轻量级个人工具集App - 记账与生理期记录
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  sqflite: ^2.3.0
  fl_chart: ^0.69.0
  intl: ^0.20.2
  uuid: ^4.4.0
  path_provider: ^2.1.0
  path: ^1.9.0
  sqflite_common_ffi: ^2.4.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system